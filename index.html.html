<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#182238;font-family:Arial}

nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:white;border-radius:15px;padding:14px;box-shadow:0 3px 12px #0000000b}
.card img{width:100%;height:175px;object-fit:contain;background:#f7f8fa;border-radius:10px}
.card h3{font-size:16px}
.cat{color:#1769d2;font-size:13px}
.price{font-weight:bold;font-size:20px;color:#1769d2}
footer{text-align:center;padding:30px;color:#667}
</style>

let category="Tümü";
const categories=["Tümü",...new Set(items.map(x=>x[1]))];
function render(){
document.getElementById("nav").innerHTML=categories.map(c=>`<button class="${c===category?'active':''}" onclick="category='${c}';render()">${c}</button>`).join("");
let list=items.filter(x=>(category==="Tümü"||x[1]===category)&&x[0].toLocaleLowerCase("tr").includes(document.getElementById("search").value.toLocaleLowerCase("tr")));
let sort=document.getElementById("sort").value;
if(sort==="low")list.sort((a,b)=>a[2]-b[2]);
if(sort==="high")list.sort((a,b)=>b[2]-a[2]);
document.getElementById("products").innerHTML=list.map(x=>`<article class="card"><img src="${x[3]}" alt="${x[0]}" loading="lazy"><div class="cat">${x[1]}</div><h3>${x[0]}</h3><div class="price">${x[2].toLocaleString("tr-TR")} TL</div></article>`).join("");
}
render();
</script>
